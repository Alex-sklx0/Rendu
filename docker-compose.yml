name: rendu

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_USE_MOCKS=true
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules   # evita que host node_modules pise los del contenedor
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rendu
      POSTGRES_PASSWORD: rendu
      POSTGRES_DB: rendu
    ports:
      - "5432:5432"
    volumes:
      - rendu_pgdata:/var/lib/postgresql/data
      # - ./database/postgres/init:/docker-entrypoint-initdb.d:ro,z

  backend:
    build: ./backend
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://rendu:rendu@postgres:5432/rendu
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres

volumes:
  rendu_pgdata:
  frontend_node_modules:   # volumen nombrado para node_modules del frontend
  backend_node_modules:    # volumen nombrado para node_modules del backend
