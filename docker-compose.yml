name: rendu

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_USE_MOCKS=false
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules   # evita que host node_modules pise los del contenedor
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:   # volumen nombrado para node_modules del frontend
  backend_node_modules:    # volumen nombrado para node_modules del backend
