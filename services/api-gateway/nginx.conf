# API Gateway — enruta cada prefijo al microservicio correspondiente.
# Responsable: Carolina. Ajustar rutas cuando cada servicio defina sus endpoints reales.

server {
    listen 80;
    server_name _;

    location /usuarios {
        proxy_pass http://auth-service:8001;
    }

    location /empresas {
        proxy_pass http://empresas-service:8002;
    }

    location /subproductos {
        proxy_pass http://subproductos-service:8003;
    }

    location /catalogo {
        proxy_pass http://catalogo-service:8004;
    }

    location /health {
        return 200 '{"gateway":"ok"}';
        add_header Content-Type application/json;
    }
}
